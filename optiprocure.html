<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procurement Marketplace</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
    }

    .header {
      background-color: #232f3e;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    .header-title {
      font-size: 24px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    select, button {
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .help-button {
      background-color: #ffa41c;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    .content {
      display: flex;
    }

    .sidebar {
      width: 200px;
      background-color: #ffffff;
      border-right: 1px solid #ddd;
      padding: 20px;
    }

    .sidebar a {
      display: block;
      color: #232f3e;
      padding: 10px 0;
      text-decoration: none;
      font-weight: bold;
    }

    .main {
      flex-grow: 1;
      padding: 30px;
    }

    .search-bar {
      display: flex;
      margin-bottom: 20px;
    }

    .search-bar input {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
    }

    .search-bar button {
      padding: 10px 15px;
      background-color: #ffa41c;
      border: none;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-weight: bold;
    }

    .marketplace {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 15px;
      text-align: center;
    }

    .product-card img {
      max-width: 100%;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .product-price {
      color: #b12704;
      font-weight: bold;
    }

    .product-buy {
      margin-top: 10px;
      background-color: #ffd814;
      border: 1px solid #fcd200;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="header-title">OptiProcure</div>
    <div class="header-controls">
      <select>
        <option>Organization A</option>
        <option>Organization B</option>
      </select>
      <select>
        <option>User A</option>
        <option>User B</option>
      </select>
      <button class="help-button" title="Help">?</button>
    </div>
  </div>

  <div class="content">
    <div class="sidebar">
      <a href="po-overview.html" class="content">Purchase Orders</a>
      <a href="invoices.html">Invoices</a>
      <a href="inventory.html">Inventory Management</a>
    </div>

    <div class="main">
      <div class="search-bar">
        <input type="text" placeholder="Search by item part number..." />
        <button>Search</button>
      </div>

      <div class="marketplace">
        <div class="product-card">
          <img src="https://via.placeholder.com/150" alt="Item 1" />
          <div class="product-title">Surgical Mask (Part #SM100)</div>
          <div class="product-price">$25.00 / Box</div>
          <button class="product-buy">Buy Now</button>
        </div>
        <div class="product-card">
          <img src="https://via.placeholder.com/150" alt="Item 2" />
          <div class="product-title">Nitrile Gloves (Part #NG200)</div>
          <div class="product-price">$18.50 / Box</div>
          <button class="product-buy">Buy Now</button>
        </div>
        <div class="product-card">
          <img src="https://via.placeholder.com/150" alt="Item 3" />
          <div class="product-title">Sterile Drapes (Part #SD300)</div>
          <div class="product-price">$45.00 / Pack</div>
          <button class="product-buy">Buy Now</button>
        </div>
        <div class="product-card">
          <img src="https://via.placeholder.com/150" alt="Item 4" />
          <div class="product-title">Syringe Pack (Part #SP400)</div>
          <div class="product-price">$12.75 / Pack</div>
          <button class="product-buy">Buy Now</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
