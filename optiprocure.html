<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="banner">
            <h1>Procurement System</h1>
            <div class="user-controls">
                <select id="organization-select">
                    <option value="org1">Organization 1</option>
                    <option value="org2">Organization 2</option>
                </select>
                <select id="user-select">
                    <option value="user1">User 1</option>
                    <option value="user2">User 2</option>
                </select>
                <a href="support.html" class="help-icon">?</a>
            </div>
        </div>
    </header>
    <div class="container">
        <nav class="sidebar">
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Inventory</a></li>
                <li><a href="po_overview.html">PO Overview</a></li>
                <li><a href="supply_management.html">Supply Management</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </nav>
        <main>
            <div class="search-bar">
                <input type="text" id="search" placeholder="Search by Part Number...">
                <button onclick="searchItem()">Search</button>
            </div>
            <div class="marketplace">
                <h2>Available Items</h2>
                <div class="items-grid" id="items-grid">
                    <div class="item">
                        <h3>Item A</h3>
                        <p>Part #: 12345</p>
                        <p>Price: $10</p>
                        <button>Add to Cart</button>
                    </div>
                    <div class="item">
                        <h3>Item B</h3>
                        <p>Part #: 67890</p>
                        <p>Price: $20</p>
                        <button>Add to Cart</button>
                    </div>
                    <div class="item">
                        <h3>Item C</h3>
                        <p>Part #: 24680</p>
                        <p>Price: $15</p>
                        <button>Add to Cart</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        function searchItem() {
            let searchValue = document.getElementById('search').value.toLowerCase();
            let items = document.querySelectorAll('.item');
            items.forEach(item => {
                let partNumber = item.querySelector('p').textContent.toLowerCase();
                item.style.display = partNumber.includes(searchValue) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
