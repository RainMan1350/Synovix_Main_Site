<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="top-bar">
            <h1>Procurement Marketplace</h1>
            <div class="user-options">
                <select id="organization-select">
                    <option>Org A</option>
                    <option>Org B</option>
                </select>
                <select id="user-select">
                    <option>User 1</option>
                    <option>User 2</option>
                </select>
                <a href="help.html" class="help-icon">?</a>
            </div>
        </div>
    </header>
    
    <nav class="sidebar">
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Orders</a></li>
            <li><a href="#">Invoices</a></li>
            <li><a href="#">Supply Management</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search by Part Number...">
            <button onclick="searchItems()">Search</button>
        </div>
        
        <div class="marketplace">
            <div class="product" data-part="12345">
                <img src="item1.jpg" alt="Item 1">
                <h3>Item 1</h3>
                <p>$25.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product" data-part="67890">
                <img src="item2.jpg" alt="Item 2">
                <h3>Item 2</h3>
                <p>$40.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product" data-part="54321">
                <img src="item3.jpg" alt="Item 3">
                <h3>Item 3</h3>
                <p>$15.00</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </main>
</body>
</html>
