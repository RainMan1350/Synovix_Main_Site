<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiCLM - Contract Management</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .search-section {
            margin-bottom: 20px;
        }
        .contract-details {
            display: none; /* Initially hidden */
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">OptiCLM - Contract Lifecycle Management</h2>
    
    <!-- Search Bar -->
    <div class="search-section">
        <label for="searchInput">Search Contract or Product:</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Enter contract name or product ID">
        
        <label for="searchType" class="mt-2">Search By:</label>
        <select id="searchType" class="form-select">
            <option selected>(Choose One)</option>
            <option value="contract">Contract</option>
            <option value="product">Product</option>
        </select>
        
        <button class="btn btn-primary mt-3" onclick="searchContract()">Search</button>
    </div>

    <!-- Contract Details -->
    <div id="contractDetails" class="contract-details">
        <h4>Contract Information</h4>
        <p><strong>Contract Name:</strong> <span id="contractName"></span></p>
        <p><strong>Category:</strong> <span id="contractCategory"></span></p>
        <p><strong>Account Representative:</strong> <span id="accountRep"></span></p>
        <p><strong>Contract Summary:</strong> <span id="contractSummary"></span></p>
        <p><strong>Expiration Date:</strong> <span id="expirationDate"></span></p>

        <h5>Contract Documents</h5>
        <ul id="contractDocuments">
            <!-- Contract files will be listed here -->
        </ul>
        
        <h5>Alerts</h5>
        <p id="contractAlerts" style="color: red; font-weight: bold;"></p>
    </div>
</div>

<script>
    function searchContract() {
        var searchInput = document.getElementById("searchInput").value;
        var searchType = document.getElementById("searchType").value;

        if (searchInput === "" || searchType === "(Choose One)") {
            alert("Please enter a search term and select a search type.");
            return;
        }

        // Simulating contract data response (replace with backend API later)
        var contractData = {
            contractName: "Surgical Equipment Agreement",
            category: "Medical Devices",
            accountRep: "John Doe - johndoe@example.com",
            contractSummary: "Covers the supply of surgical devices. Includes bulk order discounts.",
            expirationDate: "2025-06-15",
            contractDocuments: ["Master Agreement.pdf", "Addendum_1.pdf"],
            contractAlerts: "Contract expires in 90 days! Renewal required."
        };

        // Populating the contract details
        document.getElementById("contractName").innerText = contractData.contractName;
        document.getElementById("contractCategory").innerText = contractData.category;
        document.getElementById("accountRep").innerText = contractData.accountRep;
        document.getElementById("contractSummary").innerText = contractData.contractSummary;
        document.getElementById("expirationDate").innerText = contractData.expirationDate;
        document.getElementById("contractAlerts").innerText = contractData.contractAlerts;

        // Populating contract documents
        var docList = document.getElementById("contractDocuments");
        docList.innerHTML = ""; // Clear previous entries
        contractData.contractDocuments.forEach(doc => {
            var li = document.createElement("li");
            li.innerText = doc;
            docList.appendChild(li);
        });

        // Display the contract details section
        document.getElementById("contractDetails").style.display = "block";
    }
</script>

</body>
</html>
