<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiCLM - Contract Management</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .search-section {
            margin-bottom: 20px;
        }
        .contract-details {
            display: none; /* Initially hidden */
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #ffffff;
            margin-top: 10px;
        }
        .alert {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">OptiCLM - Contract Lifecycle Management</h2>
    
    <!-- Search Bar -->
    <div class="search-section">
        <label for="searchInput">Search Contract or Product:</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Enter contract name or product ID">
        
        <label for="searchType" class="mt-2">Search By:</label>
        <select id="searchType" class="form-select">
            <option selected>(Choose One)</option>
            <option value="contract">Contract</option>
            <option value="product">Product</option>
            <option value="vendor">Vendor</option>
        </select>
        
        <button class="btn btn-primary mt-3" onclick="searchContract()">Search</button>
    </div>

    <!-- Contract Details -->
    <div id="contractDetails" class="contract-details">
        <h4>Contract Information</h4>
        <p><strong>Contract Name:</strong> <span id="contractName"></span></p>
        <p><strong>Category:</strong> <span id="contractCategory"></span></p>
        <p><strong>Account Representative:</strong> <span id="accountRep"></span></p>
        <p><strong>Contract Summary:</strong> <span id="contractSummary"></span></p>
        <p><strong>Expiration Date:</strong> <span id="expirationDate"></span></p>

        <h5>Contract Documents</h5>
        <ul id="contractDocuments">
            <!-- Contract files will be listed here -->
        </ul>
        
        <h5>Alerts</h5>
        <p id="contractAlerts" class="alert"></p>

        <h5>Vendor Contact</h5>
        <p><strong>Vendor:</strong> <span id="contractVendor"></span></p>
        <p><strong>Contact Email:</strong> <span id="contactEmail"></span></p>
        <p><strong>Contact Phone:</strong> <span id="contactPhone"></span></p>
    </div>
</div>

<script>
    function searchContract() {
        var searchInput = document.getElementById("searchInput").value;
        var searchType = document.getElementById("searchType").value;

        if (searchInput === "" || searchType === "(Choose One)") {
            alert("Please enter a search term and select a search type.");
            return;
        }

        // Demo contract data (contract 123 and product abc)
        var demoContract = {
            contractNumber: "123",
            productCode: "abc",
            contractName: "ABC Contract",
            category: "Software",
            accountRep: "John Doe",
            contractSummary: "This contract governs the purchase of ABC software.",
            expirationDate: "2025-03-15",
            contractDocuments: ["Contract Document 1", "Contract Document 2"],
            vendor: "ABC Corp.",
            contactEmail: "johndoe@abccorp.com",
            contactPhone: "123-456-7890",
            contractAlerts: ""
        };

        // If user selects 'contract' and enters contract number 123
        if (searchType === "contract" && searchInput === demoContract.contractNumber) {
            populateContractDetails(demoContract);
        } 
        // If user selects 'product' and enters product code abc
        else if (searchType === "product" && searchInput === demoContract.productCode) {
            populateContractDetails(demoContract);
        } 
        else {
            alert("No matching contract or product found.");
        }
    }

    function populateContractDetails(contract) {
        document.getElementById("contractName").innerText = contract.contractName;
        document.getElementById("contractCategory").innerText = contract.category;
        document.getElementById("accountRep").innerText = contract.accountRep;
        document.getElementById("contractSummary").innerText = contract.contractSummary;
        document.getElementById("expirationDate").innerText = contract.expirationDate;

        // Contract Documents
        var docList = document.getElementById("contractDocuments");
        docList.innerHTML = ""; // Clear previous entries
        contract.contractDocuments.forEach(doc => {
            var li = document.createElement("li");
            li.innerText = doc;
            docList.appendChild(li);
        });

        // Vendor contact info
        document.getElementById("contractVendor").innerText = contract.vendor;
        document.getElementById("contactEmail").innerText = contract.contactEmail;
        document.getElementById("contactPhone").innerText = contract.contactPhone;

        // Check if the contract is about to expire (alert if it is)
        var expirationDate = new Date(contract.expirationDate);
        var currentDate = new Date();
        var daysLeft = Math.floor((expirationDate - currentDate) / (1000 * 60 * 60 * 24));

        if (daysLeft <= 30) {
            document.getElementById("contractAlerts").innerText = "Alert: Contract is about to expire in " + daysLeft + " days!";
        } else {
            document.getElementById("contractAlerts").innerText = "";
        }

        // Display the contract details section
        document.getElementById("contractDetails").style.display = "block";
    }
</script>

</body>
</html>
