<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Savings & Specialist Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#specialist-academy">Specialist Academy</a></li>
        </ul>
    </nav>
  
    <!-- Specialist Academy Section -->
    <section id="specialist-academy">
        <h1>Specialist Academy</h1>
        <p>Learn about various topics in a structured video format.</p>
        
        <!-- Video Grid (Dynamically populated) -->
        <div class="video-grid" id="videoGrid">
            <!-- Video cards will be dynamically inserted here -->
        </div>
    </section>

    <script>
        // Function to load videos from the AWS API
        function loadVideos() {
            var apiUrl = "https://your-api-url.amazonaws.com"; // Replace with your AWS API URL

            fetch(apiUrl)
                .then(response => response.json())  // Assuming the response is in JSON format
                .then(data => {
                    const videoGrid = document.getElementById('videoGrid');
                    videoGrid.innerHTML = ''; // Clear any existing content

                    // Loop through the returned video data and populate the page
                    data.videos.forEach(video => {
                        const videoCard = document.createElement('div');
                        videoCard.classList.add('video-card');

                        const videoTitle = document.createElement('h3');
                        videoTitle.textContent = video.title;
                        videoCard.appendChild(videoTitle);

                        const videoElement = document.createElement('video');
                        videoElement.src = video.url;
                        videoElement.controls = true;
                        videoCard.appendChild(videoElement);

                        // Append the video card to the grid
                        videoGrid.appendChild(videoCard);
                    });
                })
                .catch(error => {
                    console.error('Error fetching video data:', error);
                });
        }

        // Load videos when the page loads
        window.onload = loadVideos;
    </script>

    <script src="script.js"></script>
</body>
</html>
