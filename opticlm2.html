<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .contract-card {
            cursor: pointer;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            background: #f9f9f9;
        }
    </style>
</head>
<body class="container mt-4">
    <h2>Contract Management</h2>
    <input type="text" id="searchBar" class="form-control mb-3" placeholder="Search Contracts...">
    <div id="contractList" class="row"></div>
    <div id="contractDetails" class="mt-4" style="display:none;">
        <h3 id="contractName"></h3>
        <p><strong>Category:</strong> <span id="contractCategory"></span></p>
        <p><strong>Account Rep:</strong> <span id="accountRep"></span></p>
        <p><strong>Summary:</strong> <span id="contractSummary"></span></p>
        <p><strong>Expiration Date:</strong> <span id="expirationDate"></span></p>
        <h5>Documents</h5>
        <ul id="contractDocuments"></ul>
    </div>
<script>
    function loadContracts() {
        $.ajax({
            url: "https://3bry03fvjg.execute-api.us-east-1.amazonaws.com/prod",
            method: "GET",
            success: function(response) {
                var contracts = JSON.parse(response);
                var contractContainer = $("#contractCards");
                contractContainer.html(""); // Clear old data
                
                contracts.forEach(contract => {
                    var card = `<div class="col-md-4">
                        <div class="contract-card" onclick='showContractDetails(${JSON.stringify(contract)})'>
                            <h5>${contract.contract_name}</h5>
                            <p>${contract.category} Agreement</p>
                            <p>Expires on ${contract.expiration_date}</p>
                        </div>
                    </div>`;
                    contractContainer.append(card);
                });
            },
            error: function() {
                alert("Error loading contracts.");
            }
        });
    }

    function showContractDetails(contract) {
        $("#contractName").text(contract.contract_name);
        $("#contractCategory").text(contract.category);
        $("#accountRep").text(contract.account_rep);
        $("#contractSummary").text(contract.contract_summary);
        $("#expirationDate").text(contract.expiration_date);
        $("#contractDetails").show();
    }

    // Load contracts when the page loads
    $(document).ready(loadContracts);
</script>
</body>
</html>
