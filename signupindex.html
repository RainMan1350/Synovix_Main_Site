<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Exclusive Membership</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
            color: #333;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .form-group input {
            width: 48%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .full-width {
            width: 100%;
        }

        .submit-btn {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #2a5298;
        }

        .login-options {
            margin-top: 10px;
            font-size: 14px;
        }

        .login-options a {
            color: #1e3c72;
            text-decoration: none;
            font-weight: bold;
            margin: 5px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-top: 10px;
        }

        .remember-me input {
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Become a Member Today! Sign Up / Sign In Below</h2>

        <!-- Sign Up Form -->
        <form id="signupForm">
            <div class="form-group">
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email" required class="full-width">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Username" required class="full-width">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <input type="text" placeholder="Username" required class="full-width">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required class="full-width">
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <div class="remember-me">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember Me</label>
        </div>

        <div class="login-options">
            <a href="#">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
