<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savings Dashboard</title>

  <!-- Link CSS: Adjust path if needed -->
  <link rel="stylesheet" href="assets/css/main.css" onerror="this.onerror=null;this.remove();" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #E5C58F;
    }

    .chart-container {
      width: 100%;
      max-width: 800px;
      margin: 40px auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 40px;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #f4f4f4;
    }
  </style>
</head>

<body>
  <h1>Savings Dashboard</h1>

  <div class="chart-container">
    <canvas id="savingsGoalChart"></canvas>
  </div>

  <div class="chart-container">
    <canvas id="onTrackChart"></canvas>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>New Vendor</th>
        <th>Savings</th>
      </tr>
    </thead>
    <tbody id="savings-table-body">
      <!-- Populated by JS -->
    </tbody>
  </table>

  <script>
    // Sample savings data
    const savingsData = [
      { date: "2025-01-15", vendor: "Vendor X", savings: 1000 },
      { date: "2025-02-10", vendor: "Vendor Y", savings: 1200 },
      { date: "2025-03-12", vendor: "Vendor Z", savings: 1100 },
      { date: "2025-04-05", vendor: "Vendor W", savings: 1300 },
    ];

    // Calculate total and projected savings
    const totalSavings = savingsData.reduce((sum, entry) => sum + entry.savings, 0);
    const savingsGoal = 12000;
    const currentMonth = new Date().getMonth() + 1;
    const projectedAnnualSavings = (totalSavings / currentMonth) * 12;
    const onTrack = projectedAnnualSavings >= savingsGoal;

    const whiteBackgroundOptions = {
      responsive: true,
      plugins: {
        title: {
          display: true
        }
      },
      layout: {
        padding: 10
      },
      scales: {
        x: {
          grid: {
            color: '#e0e0e0'
          },
          ticks: {
            color: '#000'
          }
        },
        y: {
          grid: {
            color: '#e0e0e0'
          },
          ticks: {
            color: '#000'
          }
        }
      },
      backgroundColor: '#ffffff'
    };

    // Chart 1: YTD vs Goal
    const ctx1 = document.getElementById('savingsGoalChart').getContext('2d');
    new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: ['YTD Savings', 'Annual Goal'],
        datasets: [{
          label: 'USD',
          data: [totalSavings, savingsGoal],
          backgroundColor: ['#4caf50', '#2196f3']
        }]
      },
      options: {
        ...whiteBackgroundOptions,
        plugins: {
          ...whiteBackgroundOptions.plugins,
          title: {
            display: true,
            text: 'YTD Savings vs Annual Goal'
          }
        }
      }
    });

    // Chart 2: Projection
    const ctx2 = document.getElementById('onTrackChart').getContext('2d');
    new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: ['Projected', 'Goal'],
        datasets: [{
          label: 'Projection',
          data: [projectedAnnualSavings, savingsGoal],
          backgroundColor: ['#ff9800', '#2196f3']
        }]
      },
      options: {
        ...whiteBackgroundOptions,
        plugins: {
          ...whiteBackgroundOptions.plugins,
          title: {
            display: true,
            text: onTrack
              ? 'You Are On Track To Hit Your Goal 🎯'
              : 'You Are NOT On Track To Hit Your Goal ⚠️'
          }
        }
      }
    });

    // Populate Table
    const tableBody = document.getElementById('savings-table-body');
    savingsData.forEach(entry => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${entry.date}</td>
        <td>${entry.vendor}</td>
        <td>$${entry.savings.toLocaleString()}</td>
      `;
      tableBody.appendChild(row);
    });
  </script>
</body>
</html>
