<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Tool Dashboard</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: #f4f7f9;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: #333;
        }

        label {
            font-size: 1rem;
            margin-bottom: 8px;
            display: block;
        }

        input[type="file"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        #download {
            background-color: #007BFF;
            margin-top: 10px;
        }

        #download:hover {
            background-color: #0056b3;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input,
        .form-group select {
            margin-bottom: 10px;
        }

        #dashboard {
            margin-top: 30px;
            text-align: center;
        }

        .alert {
            display: none;
            padding: 10px;
            margin-top: 20px;
            background-color: #f44336;
            color: white;
            text-align: center;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="form-container">
            <h1>Savings Tool Dashboard</h1>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="fileUpload">Choose a CSV or XLSX file:</label>
                    <input type="file" id="fileUpload" accept=".csv,.xlsx" required>
                </div>
                <div class="form-group">
                    <label for="analysisType">Choose Analysis Type:</label>
                    <select id="analysisType">
                        <option value="savings">Savings Tool</option>
                        <option value="business_review">Business Review</option>
                        <option value="benchmarking">Benchmarking Tool</option>
                    </select>
                </div>
                <button type="submit">Upload</button>
                <button type="button" id="download" disabled>Download Transformed Data</button>
            </form>
            <div id="dashboard"></div>
            <div id="alertBox" class="alert">Please upload a file before downloading transformed data.</div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('File uploaded and processing started!');
            document.getElementById('download').disabled = false;
            document.getElementById('alertBox').style.display = 'none';
        });

        document.getElementById('download').addEventListener('click', function() {
            if (document.getElementById('fileUpload').files.length === 0) {
                document.getElementById('alertBox').style.display = 'block';
            } else {
                alert('Download of transformed data started!');
            }
        });
    </script>
</body>
</html>
