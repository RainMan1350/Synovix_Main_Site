<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Tool Dashboard</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 0;
            color: #0C333B;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: #f4f7f9;
        }

        .form-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
            border-top: 6px solid #E55C3E;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            font-weight: 600;
            color: #0C333B;
        }

        label {
            font-size: 1rem;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        input[type="file"],
        select {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease;
        }

        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: #0C333B;
        }

        button {
            background-color: #0C333B;
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #082428;
        }

        #download {
            background-color: #0C333B;
            margin-top: 10px;
        }

        #download:hover {
            background-color: #082428;
        }

        .form-group {
            margin-bottom: 20px;
        }

        #dashboard {
            margin-top: 30px;
            text-align: center;
        }

        .alert {
            display: none;
            padding: 12px;
            margin-top: 20px;
            background-color: #0C333B;
            color: white;
            text-align: center;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="form-container">
            <h1>Savings Tool Dashboard</h1>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="fileUpload">Choose a CSV or XLSX file:</label>
                    <input type="file" id="fileUpload" accept=".csv,.xlsx" required>
                </div>
                <div class="form-group">
                    <label for="analysisType">Choose Analysis Type </label>
                    <select id="analysisType">
                        <option value="savings">Savings Tool</option><span style="font-size: 16px; margin-left: 4px;">&#x25BC;</span>
                        <option value="business_review">Business Review</option>
                        <option value="benchmarking">Benchmarking Tool</option>
                    </select>
                </div>
                <button type="submit">Upload</button>
                <button type="button" id="download" disabled>Download Transformed Data</button>
            </form>
            <div id="dashboard"></div>
            <div id="alertBox" class="alert">Please upload a file before downloading transformed data.</div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault();

            alert('File uploaded and processing started!');
            document.getElementById('download').disabled = false;
            document.getElementById('alertBox').style.display = 'none';

            window.location.href = 'dynamicdashboarddemo.html';
        });

        document.getElementById('download').addEventListener('click', function () {
            if (document.getElementById('fileUpload').files.length === 0) {
                document.getElementById('alertBox').style.display = 'block';
            } else {
                alert('Download of transformed data started!');
            }
        });
    </script>
</body>
</html>
