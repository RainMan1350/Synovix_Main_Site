<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enhanced Smart Tools Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e6ecf4, #cdd5df);
      margin: 0;
      padding: 0;
      color: #333;
    }

    .dashboard-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    .dashboard {
      background-color: #ffffff;
      padding: 30px;
      width: 100%;
      max-width: 1200px;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      color: #333;
    }

    .filter-section {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-section select,
    .filter-section input,
    .filter-section button {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background-color: #f2f4f5;
    }

    .charts-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .chart-container {
      text-align: center;
      background: #fdfdfd;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
    }

    canvas {
      max-width: 100%;
      height: 300px;
    }

    .data-table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
      background: #fdfdfd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
    }

    .data-table th,
    .data-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .data-table th {
      background: #a0acc0;
      color: #fff;
    }
  </style>
</head>
<body>
<div class="dashboard-container">
  <div class="dashboard">
    <h2>Smart Tools Dashboard</h2>

    <div class="filter-section">
      <label for="toolFilter">Select Tool:</label>
      <select id="toolFilter" onchange="updateDashboard()">
        <option value="savings">Savings Tool</option>
        <option value="benchmarking">Benchmarking Tool</option>
        <option value="businessReview">Business Review Tool</option>
      </select>

      <label for="dateFilter">Select Date Range:</label>
      <input type="date" id="startDate"> to
      <input type="date" id="endDate">
      <button onclick="filterData()">Apply Filter</button>
    </div>

    <div class="charts-container">
      <div class="chart-container">
        <h3>Spending Over Time</h3>
        <canvas id="spendingChart"></canvas>
      </div>

      <div class="chart-container">
        <h3>Spending by Vendor</h3>
        <canvas id="vendorChart"></canvas>
      </div>

      <div class="chart-container">
        <h3>Savings Potential</h3>
        <canvas id="savingsChart"></canvas>
      </div>

      <div class="chart-container">
        <h3>Cost Breakdown</h3>
        <canvas id="costBreakdownChart"></canvas>
      </div>
    </div>

    <table class="data-table">
      <thead>
      <tr>
        <th>Date</th>
        <th>Vendor</th>
        <th>Spending ($)</th>
        <th>Savings ($)</th>
      </tr>
      </thead>
      <tbody id="dataTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const spendingData = [
    { date: "2025-03-01", vendor: "Vendor A", spending: 10000, savings: 1500 },
    { date: "2025-03-05", vendor: "Vendor B", spending: 15000, savings: 2000 },
    { date: "2025-03-10", vendor: "Vendor C", spending: 12000, savings: 1800 },
    { date: "2025-03-15", vendor: "Vendor A", spending: 14000, savings: 1700 },
    { date: "2025-03-20", vendor: "Vendor B", spending: 16000, savings: 2200 }
  ];

  const palette = {
    blueGray: "#4B5563",
    mutedTeal: "#5A837A",
    mutedGold: "#D6A84B",
    dustyRose: "#C97C71",
    sage: "#B5CDA3",
    steel: "#708090",
    charcoal: "#36454F"
  };

  function updateDashboard() {
    populateTable(spendingData);
    updateCharts(spendingData);
  }

  function filterData() {
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;
    const filteredData = spendingData.filter(item => item.date >= startDate && item.date <= endDate);
    populateTable(filteredData);
    updateCharts(filteredData);
  }

  function populateTable(data) {
    const tableBody = document.getElementById("dataTableBody");
    tableBody.innerHTML = "";
    data.forEach(item => {
      const row = `<tr>
                      <td>${item.date}</td>
                      <td>${item.vendor}</td>
                      <td>${item.spending}</td>
                      <td>${item.savings}</td>
                  </tr>`;
      tableBody.innerHTML += row;
    });
  }

  function updateCharts(data) {
    updateSpendingChart(data);
    updateVendorChart(data);
    updateSavingsChart(data);
    updateCostBreakdownChart(data);
  }

  function updateSpendingChart(data) {
    const ctx = document.getElementById("spendingChart").getContext("2d");
    const labels = data.map(item => item.date);
    const values = data.map(item => item.spending);

    new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Spending Over Time",
          data: values,
          borderColor: palette.steel,
          backgroundColor: "transparent"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  function updateVendorChart(data) {
    const ctx = document.getElementById("vendorChart").getContext("2d");
    const vendorTotals = {};
    data.forEach(item => {
      vendorTotals[item.vendor] = (vendorTotals[item.vendor] || 0) + item.spending;
    });

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: Object.keys(vendorTotals),
        datasets: [{
          label: "Spending by Vendor",
          data: Object.values(vendorTotals),
          backgroundColor: [palette.mutedTeal, palette.dustyRose, palette.sage]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  function updateSavingsChart(data) {
    const ctx = document.getElementById("savingsChart").getContext("2d");
    const labels = data.map(item => item.vendor);
    const values = data.map(item => item.savings);

    new Chart(ctx, {
      type: "pie",
      data: {
        labels: labels,
        datasets: [{
          label: "Savings Potential",
          data: values,
          backgroundColor: [palette.mutedGold, palette.mutedTeal, palette.dustyRose]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  function updateCostBreakdownChart(data) {
    const ctx = document.getElementById("costBreakdownChart").getContext("2d");

    new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Labor", "Supplies", "Equipment"],
        datasets: [{
          data: [40, 35, 25],
          backgroundColor: [palette.sage, palette.steel, palette.mutedGold]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  updateDashboard();
</script>
</body>
</html>
