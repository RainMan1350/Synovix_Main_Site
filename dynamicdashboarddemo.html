<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Smart Tools Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6e7bff, #4f77ff);
            margin: 0;
            padding: 0;
            color: #fff;
        }

        .dashboard-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            background-color: #ffffff;
            padding: 30px;
            width: 100%;
            max-width: 1000px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            color: #333;
        }

        .filter-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-section input,
        .filter-section select,
        .filter-section button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 1rem;
            background-color: #f0f4f7;
        }

        .chart-container {
            margin-top: 30px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 1rem;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4f77ff;
            color: white;
        }

        td {
            background-color: #f9f9f9;
        }

    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="dashboard">
        <h2>Smart Tools Dashboard</h2>

        <!-- Filter Section -->
        <div class="filter-section">
            <label for="dateFilter">Select Date Range:</label>
            <input type="date" id="startDate"> to
            <input type="date" id="endDate">
            <button onclick="filterData()">Apply Filter</button>
        </div>

        <!-- Data Table -->
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Vendor</th>
                    <th>Spending</th>
                    <th>Potential Savings</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filled dynamically -->
            </tbody>
        </table>

        <!-- Chart Section -->
        <div class="chart-container">
            <h3>Spending Over Time</h3>
            <canvas id="spendingChart"></canvas>
        </div>
    </div>
</div>

<script>
    const spendingData = [
        { date: "2025-03-01", vendor: "Vendor A", spending: 10000, savings: 1500 },
        { date: "2025-03-05", vendor: "Vendor B", spending: 15000, savings: 2000 },
        { date: "2025-03-10", vendor: "Vendor C", spending: 12000, savings: 1800 },
        { date: "2025-03-15", vendor: "Vendor A", spending: 14000, savings: 1700 },
        { date: "2025-03-20", vendor: "Vendor B", spending: 16000, savings: 2200 }
    ];

    function populateTable(data) {
        const tableBody = document.querySelector("#dataTable tbody");
        tableBody.innerHTML = "";
        data.forEach(item => {
            tableBody.innerHTML += `<tr>
                <td>${item.vendor}</td>
                <td>$${item.spending}</td>
                <td>$${item.savings}</td>
            </tr>`;
        });
    }

    function filterData() {
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;
        const filteredData = spendingData.filter(item => item.date >= startDate && item.date <= endDate);
        populateTable(filteredData);
        updateChart(filteredData);
    }

    function updateChart(data) {
        const ctx = document.getElementById("spendingChart").getContext("2d");
        const labels = data.map(item => item.date);
        const values = data.map(item => item.spending);
        
        if (window.spendingChartInstance) {
            window.spendingChartInstance.destroy();
        }
        
        window.spendingChartInstance = new Chart(ctx, {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Spending Over Time",
                    data: values,
                    borderColor: "#4f77ff",
                    fill: false
                }]
            }
        });
    }

    populateTable(spendingData);
    updateChart(spendingData);
</script>
</body>
</html>
