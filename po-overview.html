<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PO Overview</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Purchase Order Overview</h1>
    <div class="flex space-x-4">
      <select class="border rounded p-2">
        <option selected>Org: HealthPlus</option>
        <option>WellMed</option>
        <option>UnityCare</option>
      </select>
      <select class="border rounded p-2">
        <option selected>User: J. Hall</option>
        <option>A. Martinez</option>
        <option>K. Lee</option>
      </select>
      <a href="/support.html" class="flex items-center text-blue-600 hover:underline">
        <span class="material-icons mr-1">help_outline</span> Help
      </a>
    </div>
  </header>

  <main class="p-6">
    <div class="mb-6">
      <label for="poFilter" class="block text-lg font-semibold mb-2">Filter Purchase Orders</label>
      <select id="poFilter" class="border p-2 rounded w-full md:w-1/3">
        <option value="all">All</option>
        <option value="placed">Placed</option>
        <option value="fulfilled">Fulfilled</option>
      </select>
    </div>

    <div class="bg-white shadow rounded-lg overflow-x-auto">
      <table class="min-w-full table-auto text-sm text-gray-700">
        <thead class="bg-gray-200">
          <tr>
            <th class="px-4 py-2 text-left">PO Number</th>
            <th class="px-4 py-2 text-left">Date Placed</th>
            <th class="px-4 py-2 text-left">Status</th>
            <th class="px-4 py-2 text-left">Vendor</th>
          </tr>
        </thead>
        <tbody>
          <tr class="hover:bg-gray-100 cursor-pointer" onclick="window.location.href='po-detail.html'">
            <td class="px-4 py-2 text-blue-600 underline">PO-1001</td>
            <td class="px-4 py-2">2025-03-20</td>
            <td class="px-4 py-2">Fulfilled</td>
            <td class="px-4 py-2">MedEquip Supply</td>
          </tr>
          <tr class="hover:bg-gray-100 cursor-pointer" onclick="window.location.href='po-detail.html'">
            <td class="px-4 py-2 text-blue-600 underline">PO-1002</td>
            <td class="px-4 py-2">2025-03-25</td>
            <td class="px-4 py-2">Placed</td>
            <td class="px-4 py-2">CardioHealth Co.</td>
          </tr>
          <tr class="hover:bg-gray-100 cursor-pointer" onclick="window.location.href='po-detail.html'">
            <td class="px-4 py-2 text-blue-600 underline">PO-1003</td>
            <td class="px-4 py-2">2025-04-01</td>
            <td class="px-4 py-2">Fulfilled</td>
            <td class="px-4 py-2">Global Surgical</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
